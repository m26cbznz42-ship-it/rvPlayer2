<!doctype html>
<html><head><meta charset="utf-8"><title>TV Player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:fixed;top:0;left:0;width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* v2: ?v=VIDEO-ID  (optional &cue=1 = nur vorladen: stumm + pausiert, startet erst auf {play:1}) */
var q=new URLSearchParams(location.search), id=q.get("v"), cue=q.get("cue")==="1", pl=null, vol=50, muted=cue, want=!cue, ready=false;
function say(ev,d){ parent.postMessage({tvd:1,ev:ev,d:d},"*"); }
function apply(){ if(!pl||!pl.setVolume) return; pl.setVolume(vol); if(muted) pl.mute(); else pl.unMute(); }
function onYouTubeIframeAPIReady(){
  pl=new YT.Player("p",{width:"100%",height:"100%",videoId:id,host:"https://www.youtube-nocookie.com",
    playerVars:{autoplay:cue?0:1,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,loop:1,playlist:id},
    events:{onReady:function(e){ ready=true; apply(); if(want) e.target.playVideo(); say("ready"); },
            onStateChange:function(e){ if(e.data===0) e.target.playVideo(); else if(e.data===1) say("playing"); },
            onError:function(e){ say("err",e.data); }}});
}
addEventListener("message",function(e){ var m=e.data||{}; if(!m.tvd) return;
  if(m.vol!=null) vol=m.vol; if(m.muted!=null) muted=m.muted; apply();
  if(m.play){ want=true; if(ready) pl.playVideo(); }
  if(m.pause){ want=false; if(ready) pl.pauseVideo(); } });
</script></body></html>
